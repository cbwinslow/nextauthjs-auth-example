# Cloudflare Pages Configuration
# This file is for Cloudflare Pages deployment

# Build configuration
[build]
  command = "npm run build"
  publish = ".next"

# Environment variables (set these in Cloudflare dashboard)
[build.environment]
  NODE_VERSION = "18"

# Redirects and headers can be configured here
[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200

# Enable compatibility with Next.js on Cloudflare
[functions]
  directory = ".next/server"
